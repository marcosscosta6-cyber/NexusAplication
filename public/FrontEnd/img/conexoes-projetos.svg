<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc">
  <title id="title">Alunos de diferentes cursos criando juntos</title>
  <desc id="desc">Perfis de tecnologia, design e gestão conectados a um projeto compartilhado.</desc>
  <defs>
