    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b278ff"/><stop offset="1" stop-color="#7029ed"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#773cef" stop-opacity=".25"/><stop offset="1" stop-color="#773cef" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="12" stdDeviation="14" flood-color="#050719" flood-opacity=".35"/></filter>
  </defs>
