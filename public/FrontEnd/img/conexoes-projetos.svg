    <rect x="251" y="290" width="178" height="6" rx="3" fill="#3c3c5e"/><rect x="251" y="290" width="117" height="6" rx="3" fill="#a477ff"/>
    <circle cx="260" cy="323" r="11" fill="#9b6bf1" stroke="#1b1c37" stroke-width="2"/><circle cx="278" cy="323" r="11" fill="#df9d9b" stroke="#1b1c37" stroke-width="2"/><circle cx="296" cy="323" r="11" fill="#6fa9c7" stroke="#1b1c37" stroke-width="2"/>
