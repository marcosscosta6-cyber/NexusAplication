    <circle cx="250" cy="193" r="4" fill="#aa78ff"/><circle cx="264" cy="193" r="4" fill="#72549d"/><circle cx="278" cy="193" r="4" fill="#72549d"/>
    <rect x="251" y="231" width="42" height="42" rx="13" fill="url(#accent)"/>
    <path d="M262 247h20v15h-20z M262 251h20 M268 244v5 M276 244v5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
