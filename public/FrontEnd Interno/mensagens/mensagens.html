<!DOCTYPE html>
<html lang="pt-BR" data-sessao="carregando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="mensagens.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/FrontEnd%20Interno/app.css">
<link rel="stylesheet" href="/shared/modais.css">
<link rel="stylesheet" href="/shared/acessibilidade.css">
<script defer src="/shared/acessibilidade.js"></script>
</head>

<body data-pagina="mensagens">
    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <img src="/FrontEnd/img/logo-horizontal.png" alt="">
            </div>

            <div class="perfil-sidebar"><img data-usuario-foto alt="" hidden><div class="text-white"><h5 data-usuario-nome></h5><p data-usuario-cargo></p></div></div>

            <nav class="menu">
                <a href="../home/home.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>

                <a href="../explorar/explorar.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Explorar</span>
                </a>

                <a href="../conexões/conec.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Conexões</span>
                </a>

                <a href="../mensagens/mensagens.html" class="active">
                    <i class="fa-solid fa-message"></i>
                    <span>Mensagens</span>
                </a>

                <a href="../projetos/projetos.html">
                    <i class="fa-solid fa-folder"></i>
                    <span>Projetos</span>
                </a>

                <a href="../notificações/not.html">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notificações</span>
                </a>

                <a href="../perfil/perfil.html">
                    <i class="fa-solid fa-user"></i>
                    <span>Perfil</span>
                </a>
            </nav>

            <div class="bottom-menu">
                <a href="../config/config.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>

                <button id="Sair" class="btn botaosair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- CONTEÚDO -->
        <div class="content">

            <!-- MENSAGENS -->
            <p id="aviso-app" class="aviso-app" role="alert" hidden></p><main class="mensagens-container">

                <!-- LISTA DE CONVERSAS -->
                <section class="lista-conversas" id="listaConversas">

                    <div class="titulo-conversas">
                        <h2>Mensagens</h2>

                        <button id="btn-novo-chat">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>

                    <div class="buscar-usuarios" id="buscarUsuarios" hidden>

                        <input type="text" placeholder="Pesquisar usuário..." id="pesquisaUsuario"><div id="pessoas-chat"></div>





                    </div>

                    <div id="listaChats"><p>Nenhuma conversa ainda.</p></div>
                </section>

                <!-- CHAT -->
                <section class="chat-area">

                    <div class="chat-header" id="chat-cabecalho"><img id="foto-chat" alt="" hidden><div><h3>Selecione uma conversa</h3><span></span></div></div>

                    <button id="mensagens-anteriores" hidden>Carregar anteriores</button><div class="chat-mensagens" id="chat-mensagens"></div>

                    <form class="chat-input" id="enviar-mensagem">

                        <input
                            type="text" name="texto" maxlength="2000" disabled
                            placeholder="Digite sua mensagem..."
                        >

                        <button disabled aria-label="Enviar mensagem">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>

                    </form>

                </section>

            </main>

        </div>

    </div>

<div class="overlay" id="overlay">

    <div class="mesmosair">
        <p>Certeza que você quer <span>sair?</span> </p>

        <div class="sae">
        <Button class="btn btn-sim" onclick=sim()>Sim</Button>
        <button class="btn btn-sair" onclick=nao()>Não</button>
        </div>
    </div>
  </div>



<script src="/FrontEnd%20Interno/sair.js"></script>
<script type="module" src="/FrontEnd%20Interno/app.js"></script>
</body>
</html>
